<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miro Kitchen</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Playfair+Display:wght@600;800&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e0b;--s1:#1b1511;--s2:#261d16;--bd:#3a2d22;--tx:#f4ead8;--mu:#a8957d;--gd:#d4af6a;--gd2:#a67c35;--on:#1a120b;--bad:#e5645b;--ok:#7fb069;--pr:var(--gd);--cd:var(--s1);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#faf5ea;--s1:#fffdf7;--s2:#f1e6d0;--bd:#e0d0b2;--tx:#2a1f14;--mu:#7b6a55;--gd:#9a6f26;--gd2:#7a5518;--on:#fff;--bad:#b3261e;--ok:#3f7d2a;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.serif{font-family:'Playfair Display',Georgia,serif}.kf{font-family:'Reem Kufi',Cairo,sans-serif}
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 38%,var(--s2),var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s}
#splash img{width:min(60vw,250px);border-radius:50%;border:2px solid var(--gd);padding:6px;box-shadow:0 0 70px #d4af6a30}
.bar{width:min(64vw,260px);height:5px;background:var(--bd);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gd2),var(--gd));transition:width .1s}
#pct{font-family:'Playfair Display',serif;color:var(--gd);font-size:22px;letter-spacing:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(var(--s1),var(--bg));border-bottom:1px solid var(--bd)}
header img{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--gd)}
header b{display:block;font-family:'Playfair Display',serif;font-size:23px;color:var(--gd);line-height:1.1;user-select:none}
header small{font-size:11px;letter-spacing:2.5px;color:var(--mu)}
main{padding:16px;max-width:760px;margin:auto}
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;background:var(--s2) center/cover;border:1px solid var(--gd2)}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0a0705f2 8%,#0a070540 75%)}
.hero div{position:relative;padding:22px;color:#f4ead8}
.hero h1{margin:6px 0 6px;font-size:27px;line-height:1.35}.hero p{margin:0;color:#d9c9ae;font-size:14px}
.tag{display:inline-block;border:1px solid var(--gd);color:var(--gd);border-radius:20px;padding:2px 12px;font-size:12px}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.sec h2{margin:0;font-family:'Reem Kufi',Cairo;font-size:21px;font-weight:700;color:var(--gd)}.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gd2),transparent)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat{position:relative;aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--s2) center/cover;border:1px solid var(--gd2);display:flex;align-items:flex-end;box-shadow:0 12px 28px #0006}
.cat::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0a0705f5 5%,transparent 62%)}
.cn{position:relative;padding:14px;color:#f4ead8;width:100%}.cn b{display:block;font-size:17px;line-height:1.3}.cn small{color:var(--gd);font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.pc{background:var(--s1);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:.8}
.pi{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;font-size:54px;background:var(--s2) center/cover}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}.pb b{font-size:14px;line-height:1.35}.pb small{color:var(--mu);font-size:11px;min-height:15px}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:4px}.pr strong{color:var(--gd);font-size:19px}.pr em{font:600 11px Cairo;color:var(--mu)}
.add{width:36px;height:36px;border-radius:50%;background:linear-gradient(145deg,#efd08a,var(--gd),var(--gd2));color:var(--on);font-size:22px;font-weight:700;line-height:1;box-shadow:0 4px 12px #d4af6a44}
.ed{position:absolute;top:8px;left:8px;background:#000b;color:#fff;border-radius:50%;width:32px;height:32px;z-index:2}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:1fr 1fr 1fr;direction:ltr;align-items:end;height:calc(68px + env(safe-area-inset-bottom,0px));padding:0 10px env(safe-area-inset-bottom,0px);background:linear-gradient(var(--s1),var(--bg));border-top:1px solid var(--gd2);box-shadow:0 -10px 30px #0007}
nav button{height:68px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding-bottom:9px;color:var(--mu);font-size:11.5px;font-weight:600;position:relative}
nav button svg{width:25px;height:25px}nav button.on{color:var(--gd)}
nav .hm{color:var(--gd)}
nav .hm i{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#f6dc9c,var(--gd) 48%,var(--gd2));color:#1a120b;border:5px solid var(--bg);box-shadow:0 0 0 1.5px var(--gd),0 12px 28px #d4af6a55;animation:pop 2.2s ease-in-out infinite}
nav .hm i svg{width:36px;height:36px}
@keyframes pop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.09)}}
nav .hm:active i{animation:none;transform:scale(.9)}
@media(prefers-reduced-motion:reduce){nav .hm i{animation:none}}
nav em[hidden]{display:none}nav em{position:absolute;top:6px;left:calc(50% + 6px);background:var(--gd);color:var(--on);border-radius:9px;font-style:normal;font-size:11px;font-weight:800;padding:0 6px;min-width:18px;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:11px 13px;margin-bottom:10px}
.row>div:first-child{flex:1;min-width:0}.row small{color:var(--mu)}
.th{width:50px;height:50px;border-radius:12px;background:var(--s2) center/cover;display:grid;place-items:center;font-size:24px;flex:none}
.q{display:flex;align-items:center;gap:10px}.q button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gd2);color:var(--gd);font-weight:800}
.btn{display:block;background:linear-gradient(145deg,#efd08a,var(--gd),var(--gd2));color:var(--on);border-radius:14px;padding:13px 16px;font-weight:800;width:100%;margin-top:10px}
.btn.g{background:#1f9d55;color:#fff}.btn.o{background:none;border:1.5px solid var(--gd2);color:var(--gd)}.btn.r{background:var(--bad);color:#fff}
.btn.sm{padding:7px 14px;width:auto;margin:0;font-size:13px;border-radius:11px}
input,select,textarea{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:11px 13px;margin:5px 0 9px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gd)}
.filepick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
label{font-size:13px;color:var(--mu);font-weight:600}
.up{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px dashed var(--gd);border-radius:16px;padding:16px;margin:6px 0 10px;color:var(--gd);overflow:hidden}
.up input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;padding:0;cursor:pointer}.up img{width:110px;height:110px;object-fit:cover;border-radius:14px}
.paste{border:1.5px dashed var(--bd);border-radius:14px;padding:14px;min-height:56px;text-align:center;margin:6px 0 10px;color:var(--mu);font-size:13px;-webkit-user-select:text;user-select:text}.paste:empty::before{content:attr(data-ph)}.sec .btn{flex:none;font-size:12px;padding:7px 10px}.atabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.atabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px;border-radius:14px;background:var(--s1);border:1px solid var(--bd);font-size:11px;font-weight:600;color:var(--mu)}
.atabs button span{font-size:20px}.atabs button.on{border-color:var(--gd);color:var(--gd);background:var(--s2)}
.seg{display:flex;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}.seg button{flex:1;padding:8px 0;border-radius:10px;font-weight:600;color:var(--mu)}.seg button.on{background:var(--gd);color:var(--on)}
.big{background:linear-gradient(145deg,var(--s2),var(--s1));border:1px solid var(--gd2);border-radius:22px;padding:18px;margin-bottom:12px}.big small{color:var(--mu)}.big b{display:block;font-size:32px;margin-top:2px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.st{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:12px}.st small{color:var(--mu);font-size:12px}.st b{display:block;font-size:19px;margin-top:2px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 8px;font-size:16px;color:var(--gd)}
.chart{display:flex;align-items:flex-end;gap:8px;height:110px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu);gap:4px}.chart i{width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--gd),var(--gd2));min-height:3px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
#modal{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:flex-end;justify-content:center}
#modal>div{background:var(--s1);border-top:2px solid var(--gd);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px}
#toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:var(--gd);color:var(--on);font-weight:700;padding:9px 18px;border-radius:20px;z-index:60;display:none}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;display:block!important}#modal>div{max-height:none;background:#fff;color:#000}.np{display:none}}
</style>

function setT(){return `<div class="card"><h3>الواتساب والأمان</h3><label>رقم واتساب استقبال الطلبات</label><input id="sw" type="tel" placeholder="01xxxxxxxxx" value="${esc(cfg.wa)}"><label>الرقم السري للإدارة</label><input id="sp" value="${esc(cfg.pin)}"><button class="btn" onclick="cfg.wa=$('#sw').value;cfg.pin=$('#sp').value||'1234';W('cfg',cfg);toast('تم الحفظ')">حفظ</button></div>
<div class="card"><h3>صور الأقسام</h3>${cats.map(c=>`<div class="row"><div class="th" style="${c.img?`background-image:url(${c.img})`:''}"></div><div>${esc(c.n)}</div><button class="btn sm" onclick="catImg('${c.id}')">📷 تغيير</button></div>`).join('')}</div>
<div class="card"><h3>القائمة</h3><button class="btn o" style="margin:0" onclick="adm=!adm;toast(adm?'أزرار التعديل ظاهرة':'أزرار التعديل مخفية')">إظهار / إخفاء أزرار ✏️ على المنتجات</button><button class="btn r" onclick="logout()">تسجيل خروج</button></div>`}
